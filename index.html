
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Cloud Dashboard</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 padding:20px;background:#0b1020;color:#f5f7ff;
 font-family:Inter,Arial,sans-serif
}
.card{
 width:100%;max-width:420px;padding:30px;
 background:#151d32;border:1px solid #293653;
 border-radius:22px;box-shadow:0 25px 80px #0007
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
 width:46px;height:46px;border-radius:13px;
 display:grid;place-items:center;background:#1d3154;
 color:#75a9ff;font-size:24px
}
.brand strong{letter-spacing:1px}
.muted{color:#91a3c3;font-size:13px}
.online{margin-left:auto;color:#5de0a0;font-size:12px}
.line{height:1px;background:#293653;margin:25px 0}
h1{font-size:30px;margin:0 0 9px}
.description{color:#aab8d2;font-size:14px;line-height:1.6}
label{display:block;color:#aab8d2;font-size:12px;
 letter-spacing:1px;margin:25px 0 9px}
.password{display:flex;align-items:center;
 background:#0d1528;border:1px solid #394965;
 border-radius:11px;padding-right:12px}
input{
 width:100%;min-width:0;padding:15px;background:transparent;
 border:0;outline:none;color:white;font-size:15px
}
input::placeholder{color:#70809d}
.toggle{background:none;border:0;color:#91a3c3;cursor:pointer}
button.login{
 width:100%;margin-top:20px;padding:15px;border:0;
 border-radius:11px;background:#3868d9;color:white;
 font-size:15px;font-weight:bold;cursor:pointer
}
button.login:disabled{opacity:.5;cursor:not-allowed}
.options{display:flex;justify-content:space-between;
 align-items:center;margin-top:15px;font-size:12px;color:#91a3c3}
#message{font-size:12px;color:#f5c46b;min-height:18px;margin-top:12px}
.footer{display:flex;justify-content:space-between;
 color:#7184a5;font-size:11px}
</style>
</head>
<body>
<main class="card">
 <div class="brand">
  <div class="logo">⌘</div>
  <div>
   <strong>ESP32 CLOUD</strong>
   <div class="muted">SMART DEVICE MANAGEMENT</div>
  </div>
  <div class="online">● ONLINE</div>
 </div>

 <div class="line"></div>

 <h1>Welcome back.</h1>
 <div class="description">
  Sign in to access your smart light controller.
 </div>

 <form id="loginForm">
  <label for="password">DASHBOARD PASSWORD</label>
  <div class="password">
   <input id="password" type="password"
    placeholder="Enter your password" required>
   <button class="toggle" type="button" id="toggle">Show</button>
  </div>
  <div class="options">
   <span>Secure dashboard access</span>
   <span>🔒 Protected</span>
  </div>
  <button class="login" type="submit">Sign in →</button>
  <div id="message" role="status"></div>
 </form>

 <div class="line"></div>
 <div class="footer">
  <span>ESP32 Cloud Control</span>
  <span>Secure Dashboard</span>
 </div>
</main>

<script>
const password=document.getElementById("password");
const toggle=document.getElementById("toggle");
const message=document.getElementById("message");

toggle.addEventListener("click",()=>{
 const visible=password.type==="password";
 password.type=visible?"text":"password";
 toggle.textContent=visible?"Hide":"Show";
});

document.getElementById("loginForm").addEventListener("submit",e=>{
 e.preventDefault();
 message.textContent=
 "Login interface ready. Secure authentication is not connected yet.";
});
</script>
</body>
</html>
